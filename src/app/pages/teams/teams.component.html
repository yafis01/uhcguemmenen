<div class="teams-page">
    <section class="page-header"></section>

    <section class="container">
        <div class="category-section">
            <h2 class="category-title">Aktive</h2>
        </div>
    </section>

  <section class="container no-top-padding">
    <div class="teams-grid">
      <div class="team-card" *ngFor="let team of teams">
        <div class="team-image">
            <ng-container *ngIf="team.image; else defaultIcon">
                <img [src]="team.image" alt="Foto von {{ team.name }}">
            </ng-container>
            <ng-template #defaultIcon>
                <i class="fa-solid fa-people-group"></i>
            </ng-template>
        </div>
        <div class="team-info">
          <span class="team-category">{{ team.category }}</span>
          <h2>{{ team.name }}</h2>
          <p>{{ team.description }}</p>
          <div class="coach-info">
            <strong>Trainer:</strong> {{ team.coach }}
          </div>
          <button (click)="toggleRoster(team)" class="toggle-roster-btn">
            {{ team.isRosterVisible ? 'Kader ausblenden' : 'Kader einblenden' }}
          </button>
        </div>

        <div *ngIf="team.isRosterVisible" class="team-roster">
          <h3>Mitglieder</h3>
          <div class="players-grid">
            <div class="player-card" *ngFor="let player of team.players">
              <div class="player-image-container">
                <img [src]="player.image || 'assets/default/default-profile.png'" alt="{{ player.name }}" class="player-image">
                <div class="player-number-badge">{{ player.number }}</div>
              </div>
              <div class="player-info">
                <div class="player-name">{{ player.name }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </section>
</div>
